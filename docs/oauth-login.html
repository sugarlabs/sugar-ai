<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Sugar-AI</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/oauth.css">
</head>
<body>
    <div class="login-container">
        <h1>Sign In to Sugar-AI</h1>

        <div id="oauth-error" style="display:none; color:#c0392b; margin-bottom:1rem;"></div>

        <div class="login-buttons">
            <a id="github-login" href="#" class="oauth-btn github-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                Sign in with GitHub
            </a>

            <a id="google-login" href="#" class="oauth-btn google-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/>
                </svg>
                Sign in with Google
            </a>
        </div>

        <div class="login-separator"><span>or</span></div>

        <a href="admin-login.html" class="api-login-btn">Continue with API Key</a>

        <a href="index.html" class="return-link">Return to Homepage</a>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/wake.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const err = params.get("error");
            if (err) {
                const box = document.getElementById("oauth-error");
                box.style.display = "block";
                box.textContent = "Login failed: " + err;
            }

            const frontendReturn = encodeURIComponent(window.location.origin + window.location.pathname.replace(/oauth-login\.html$/, "dashboard.html"));
            document.getElementById("github-login").href =
                window.SugarApi.backendUrl("/auth/github?frontend_redirect=" + frontendReturn);
            document.getElementById("google-login").href =
                window.SugarApi.backendUrl("/auth/google?frontend_redirect=" + frontendReturn);
        });
    </script>
</body>
</html>
